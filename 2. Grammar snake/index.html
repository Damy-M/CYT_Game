<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grammar Snake Arcade</title>
    <style>
        :root { --blue: #00d4ff; --pink: #ff00ff; --bg: #050508; --green: #00ff41; --red: #ff3131; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; touch-action: none; }
        
        #game-board { position: relative; width: 90vw; max-width: 400px; aspect-ratio: 1/1; background: #000; border: 3px solid var(--blue); box-shadow: 0 0 20px rgba(0,212,255,0.3); overflow: hidden; }
        
        .hud { width: 90%; max-width: 400px; display: flex; justify-content: space-around; padding: 10px; font-weight: bold; color: var(--blue); font-family: monospace; font-size: 1.1rem; }
        #mission-control { width: 90%; max-width: 400px; text-align: center; color: var(--pink); font-size: 1.1rem; margin: 10px 0; min-height: 2.5em; text-shadow: 0 0 5px var(--pink); }

        .controls { display: grid; grid-template-areas: ". up ." "left down right"; gap: 15px; margin-top: 20px; }
        .btn-ctrl { width: 70px; height: 70px; background: rgba(0, 212, 255, 0.1); border: 2px solid var(--blue); color: var(--blue); border-radius: 50%; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn-ctrl:active { background: var(--blue); color: #000; }

        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        button#start-btn { background: linear-gradient(45deg, #00d4ff, #9d00ff); color: white; border: none; padding: 20px 50px; border-radius: 15px; font-size: 1.5rem; font-weight: bold; }
        .hidden { display: none !important; }
        
        .snake-part { position: absolute; width: 20px; height: 20px; background: var(--pink); border-radius: 4px; box-shadow: 0 0 5px var(--pink); }
        .food-item { position: absolute; color: #ccff00; font-weight: bold; font-family: monospace; font-size: 14px; white-space: nowrap; }
    </style>
</head>
<body>

    <audio id="snd-bg" loop><source src="fondo.mp3" type="audio/mpeg"></audio>
    <audio id="snd-eat"><source src="jump.mp3" type="audio/mpeg"></audio>
    <audio id="snd-win"><source src="win.mp3" type="audio/mpeg"></audio>
    <audio id="snd-lose"><source src="lose.mp3" type="audio/mpeg"></audio>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--blue); font-size: 2.5rem;">SNAKE MISSION</h1>
        <button id="start-btn">START</button>
    </div>

    <div class="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>SHIELD: <span id="shield-val">5/5</span></div>
    </div>

    <div id="mission-control">Initializing...</div>
    
    <div id="game-board"></div>

    <div class="controls">
        <div class="btn-ctrl" style="grid-area: up;" id="m-up">▲</div>
        <div class="btn-ctrl" style="grid-area: left;" id="m-left">◀</div>
        <div class="btn-ctrl" style="grid-area: down;" id="m-down">▼</div>
        <div class="btn-ctrl" style="grid-area: right;" id="m-right">▶</div>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>

    <script>
        // Conectamos los botones táctiles con la lógica de game.js
        const mobileKeys = {
            'm-up': 'ArrowUp',
            'm-down': 'ArrowDown',
            'm-left': 'ArrowLeft',
            'm-right': 'ArrowRight'
        };

        Object.keys(mobileKeys).forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                window.dispatchEvent(new KeyboardEvent('keydown', { 'key': mobileKeys[id] }));
            });
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            if(typeof initGame === 'function') initGame(); 
            // Nota: Asegúrate que en game.js tengas una función que inicie el loop
        });
    </script>
</body>
</html>

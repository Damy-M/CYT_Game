<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYT: Grammar Snake</title>
    <style>
        :root { --blue: #00d4ff; --pink: #ff00ff; --bg: #050508; }
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .hud { display: flex; justify-content: space-around; padding: 10px; border-bottom: 2px solid var(--pink); background: #000; }
        #mission-text { padding: 15px; text-align: center; font-size: 1.1rem; background: rgba(255,0,255,0.05); min-height: 60px; }
        .word-box { border-bottom: 2px solid var(--blue); margin: 0 4px; padding: 0 5px; min-width: 45px; display: inline-block; }
        .word-box.found { color: var(--blue); border-bottom: none; }
        #game-container { flex-grow: 1; position: relative; background: #000; margin: 10px; border: 2px solid #333; overflow: hidden; }
        .snake-part { position: absolute; width: 20px; height: 20px; background: var(--blue); border-radius: 4px; z-index: 10; }
        .food { position: absolute; padding: 8px 12px; background: rgba(0,0,0,0.8); border: 2px solid var(--pink); color: white; border-radius: 8px; font-size: 0.9rem; font-weight: bold; z-index: 5; white-space: nowrap; transform: translate(-50%, -50%); }
        .controls { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 12px; padding: 20px; justify-content: center; background: #0a0a0c; }
        .btn { width: 65px; height: 65px; background: rgba(255,0,255,0.1); border: 2px solid var(--pink); color: white; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
        .fb-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 2rem; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>
    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>HP: <span id="lives">5</span></div>
    </div>
    <div id="mission-text">TOCA UNA FLECHA PARA INICIAR</div>
    <div id="game-container"></div>
    <div class="controls">
        <button class="btn up" onclick="changeDir(0, -20)">▲</button>
        <button class="btn left" onclick="changeDir(-20, 0)">◀</button>
        <button class="btn right" onclick="changeDir(20, 0)">▶</button>
        <button class="btn down" onclick="changeDir(0, 20)">▼</button>
    </div>
    <audio id="fondo-music" src="fondo.mp3" loop></audio>
    <audio id="snd-eat" src="jump.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>
    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYT: Snake Mobile</title>
    <style>
        body { margin: 0; background: #050508; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .hud { display: flex; justify-content: space-around; padding: 10px; border-bottom: 2px solid #ff00ff; font-weight: bold; }
        #mission-control { padding: 15px; text-align: center; font-size: 1.2rem; min-height: 40px; border-bottom: 1px solid #333; }
        .slot { border-bottom: 2px solid #00d4ff; margin: 0 5px; padding: 0 5px; }
        #game-board { flex-grow: 1; position: relative; background: #000; margin: 10px; border: 1px solid #222; }
        
        /* BOTONES DE CONTROL */
        .controls { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 10px; padding: 20px; justify-content: center; background: #000; }
        .btn { width: 60px; height: 60px; background: rgba(255, 0, 255, 0.2); border: 2px solid #ff00ff; color: white; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .up { grid-area: up; } .left { grid-area: left; } .right { grid-area: right; } .down { grid-area: down; }
        
        .snake-part { position: absolute; width: 20px; height: 20px; background: #00d4ff; }
        .food-item { position: absolute; padding: 5px; border: 1px solid #00ff41; color: #00ff41; background: rgba(0,0,0,0.8); font-size: 0.8rem; z-index: 10; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>HP: <span id="shield-val">5/5</span></div>
    </div>
    <div id="mission-control"></div>
    <div id="game-board"></div>
    
    <div class="controls">
        <button class="btn up" onclick="setDir(0, -20)">▲</button>
        <button class="btn left" onclick="setDir(-20, 0)">◀</button>
        <button class="btn right" onclick="setDir(20, 0)">▶</button>
        <button class="btn down" onclick="setDir(0, 20)">▼</button>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
    <script>
        function setDir(x, y) {
            if (typeof nextDir !== 'undefined') {
                if (x !== 0 && dir.x === 0) nextDir = {x, y: 0};
                if (y !== 0 && dir.y === 0) nextDir = {x: 0, y};
            }
        }
    </script>
</body>
</html>

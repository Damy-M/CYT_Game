<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYT: Grammar Snake</title>
    <style>
        :root { --blue: #00d4ff; --pink: #ff00ff; --bg: #050508; }
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: 'Courier New', Courier, monospace; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; 
        }

        /* HUD Superior */
        .hud {
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px; background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--pink); box-shadow: 0 0 15px var(--pink);
            z-index: 10;
        }
        .hud-item { font-size: 1.1rem; font-weight: bold; color: var(--pink); }
        #score-val { color: var(--blue); }

        /* Contenedor de la Misión Gramatical */
        #mission-control {
            padding: 20px; text-align: center; font-size: 1.3rem;
            background: rgba(255, 0, 255, 0.05); min-height: 50px;
            color: #fff; border-bottom: 1px solid #333;
        }
        .slot { border-bottom: 2px solid var(--blue); margin: 0 5px; padding: 0 10px; min-width: 50px; display: inline-block; }
        .slot.done { color: var(--blue); border-bottom-color: transparent; }

        /* Tablero de Juego */
        #game-board {
            flex-grow: 1; position: relative; background: #000;
            overflow: hidden; border: 2px solid #222; margin: 10px;
        }

        .snake-part { position: absolute; width: 20px; height: 20px; border-radius: 4px; box-shadow: 0 0 5px currentColor; }
        .food-item { 
            position: absolute; padding: 5px 10px; background: rgba(0,0,0,0.7);
            border: 1px solid currentColor; font-weight: bold; font-size: 0.9rem;
            white-space: nowrap; border-radius: 5px; z-index: 5;
        }

        .back-btn {
            position: fixed; bottom: 20px; right: 20px;
            padding: 10px 15px; background: transparent; border: 1px solid var(--blue);
            color: var(--blue); text-decoration: none; font-size: 0.8rem; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-item">SCORE: <span id="score-val">0</span></div>
        <div class="hud-item">SHIELDS: <span id="shield-val">5/5</span></div>
    </div>

    <div id="mission-control">
        </div>

    <div id="game-board"></div>

    <a href="../index.html" class="back-btn">◀ MENU PRINCIPAL</a>

    <audio id="snd-eat" src="eat.mp3"></audio>
    <audio id="snd-win" src="win.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>

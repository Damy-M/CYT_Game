<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grammar Snake</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        .hud { display: flex; justify-content: space-around; padding: 10px; background: #111; border-bottom: 2px solid #f0f; }
        #game-box { position: relative; width: 100vw; height: 55vh; background: #050505; }
        .snake { position: absolute; width: 18px; height: 18px; border-radius: 4px; background: #fff; box-shadow: 0 0 10px #0f0; z-index: 10; }
        .food { position: absolute; padding: 6px; border: 1px solid #f0f; border-radius: 5px; font-size: 0.8rem; background: #000; color: white; z-index: 5; }
        .controls { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 8px; justify-content: center; padding: 10px; }
        .btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #f0f; background: #111; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="hud"><div>SCORE: <span id="score">0</span></div><div id="m-text">I ___ STUDYING</div></div>
    <div id="game-box"></div>
    <div class="controls">
        <button class="btn" style="grid-area:up" onclick="move(0,-20)">▲</button>
        <button class="btn" style="grid-area:left" onclick="move(-20,0)">◀</button>
        <button class="btn" style="grid-area:right" onclick="move(20,0)">▶</button>
        <button class="btn" style="grid-area:down" onclick="move(0,20)">▼</button>
    </div>

    <audio id="s_bg" src="snake_bg.mp3" loop></audio>
    <audio id="s_eat" src="snake_eat.mp3"></audio>
    <audio id="s_err" src="snake_error.mp3"></audio>
    <audio id="s_die" src="snake_die.mp3"></audio>

    <script>
        let snake = [{x: 100, y: 100}, {x: 80, y: 100}], dir = {x: 0, y: 0}, score = 0, audio = false;
        const box = document.getElementById("game-box");
        const mission = { words: ["AM"], fakes: ["DO", "HAVE", "IS", "ARE"] };

        function spawn() {
            document.querySelectorAll(".food").forEach(f => f.remove());
            [...mission.words, ...mission.fakes].sort(()=>Math.random()-0.5).forEach(txt => {
                const f = document.createElement("div"); f.className = "food"; f.innerText = txt;
                f.style.left = Math.random() * (window.innerWidth - 60) + "px";
                f.style.top = Math.random() * (box.clientHeight - 40) + "px";
                f.dataset.ok = mission.words.includes(txt);
                box.appendChild(f);
            });
        }
        function move(x, y) { if(!audio){document.getElementById("s_bg").play(); audio=true;} dir = {x, y}; }
        
        setInterval(() => {
            if (dir.x === 0 && dir.y === 0) return;
            let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            if (head.x < 0) head.x = window.innerWidth - 20; else if (head.x >= window.innerWidth) head.x = 0;
            if (head.y < 0) head.y = box.clientHeight - 20; else if (head.y >= box.clientHeight) head.y = 0;
            
            snake.unshift(head);
            let ate = false;
            document.querySelectorAll(".food").forEach(f => {
                if (Math.abs(head.x - parseInt(f.style.left)) < 30 && Math.abs(head.y - parseInt(f.style.top)) < 30) {
                    if (f.dataset.ok === "true") { 
                        document.getElementById("s_eat").play(); score += 100; spawn(); 
                    } else { 
                        document.getElementById("s_err").play(); score = Math.max(0, score-50); 
                    }
                    ate = true;
                }
            });
            if (!ate) snake.pop();
            draw();
        }, 150);

        function draw() {
            document.querySelectorAll(".snake").forEach(s => s.remove());
            snake.forEach(p => {
                const s = document.createElement("div"); s.className = "snake";
                s.style.left = p.x + "px"; s.style.top = p.y + "px";
                box.appendChild(s);
            });
            document.getElementById("score").innerText = score;
        }
        spawn();
    </script>
</body>
</html>

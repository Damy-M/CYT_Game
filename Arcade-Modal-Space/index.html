<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYT Arcade: Modal Defense</title>
    <style>
        :root { --blue: #00d4ff; --pink: #ff00ff; --green: #00ff41; --bg: #050508; }
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .hud { display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--blue); background: rgba(0,0,0,0.9); z-index: 10; font-weight: bold; }
        #sentence-display { padding: 20px; text-align: center; font-size: 1.2rem; background: rgba(0, 212, 255, 0.05); border-bottom: 1px solid #222; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        #game-area { flex-grow: 1; position: relative; background: #000; overflow: hidden; }
        .invader { position: absolute; padding: 12px 18px; background: rgba(0,0,0,0.9); border: 2px solid var(--green); color: white; border-radius: 10px; font-weight: bold; box-shadow: 0 0 10px var(--green); text-transform: uppercase; z-index: 5; }
        #player { position: absolute; bottom: 30px; width: 45px; height: 45px; background: var(--blue); border-radius: 5px; transform: translateX(-50%); box-shadow: 0 0 15px var(--blue); }
        .fb-text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: bold; z-index: 100; font-size: 2.5rem; text-shadow: 0 0 20px black; pointer-events: none; }
        .back-btn { position: fixed; top: 75px; right: 10px; font-size: 0.7rem; color: var(--pink); text-decoration: none; border: 1px solid var(--pink); padding: 5px 10px; background: rgba(0,0,0,0.5); z-index: 100; }
    </style>
</head>
<body>
    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div id="round-counter">RD: 1/15</div>
    </div>
    <div id="sentence-display">TOCA LA PANTALLA PARA EMPEZAR</div>
    <div id="game-area"><div id="player" style="left: 50%;"></div></div>
    <a href="../index.html" class="back-btn">EXIT</a>

    <audio id="fondo-music" src="fondo.mp3" loop></audio>
    <audio id="snd-eat" src="WIN.mp3"></audio>
    <audio id="snd-lose" src="Lose.mp3"></audio>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Space: Grammar Defense</title>
    <style>
        :root { --blue: #00d4ff; --pink: #ff00ff; --bg: #050508; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* HUD Mejorado */
        .hud { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 15px; 
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--blue);
            font-family: monospace;
            z-index: 10;
        }
        .hud-item { font-size: 1.2rem; font-weight: bold; color: var(--blue); }
        #round-counter { color: var(--pink); text-shadow: 0 0 5px var(--pink); }

        #game-container { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        canvas { border: 2px solid #222; background: #000; max-width: 100%; max-height: 100%; }

        #sentence-display {
            position: absolute; top: 80px; width: 100%; text-align: center;
            font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px var(--blue);
            pointer-events: none; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-item">PUNTOS: <span id="score">0</span></div>
        <div class="hud-item" id="round-counter">MISIÓN: 1/0</div>
    </div>

    <div id="sentence-display">Cargando misión...</div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>

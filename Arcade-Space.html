<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Space</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        .hud { display: flex; justify-content: space-around; padding: 10px; background: #111; border-bottom: 2px solid #00d4ff; }
        #sentence { padding: 15px; text-align: center; font-size: 1.2rem; color: #00d4ff; min-height: 40px; font-weight: bold; }
        #game-area { height: calc(100vh - 120px); position: relative; width: 100%; }
        .invader { position: absolute; padding: 10px 15px; border: 2px solid; border-radius: 8px; font-weight: bold; font-size: 0.8rem; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="hud"><div>SCORE: <span id="score">0</span></div><div>RD: <span id="rd">1</span>/5</div></div>
    <div id="sentence">TOCA UNA NAVE PARA INICIAR</div>
    <div id="game-area"></div>

    <audio id="m_bg" src="space_bg.mp3" loop></audio>
    <audio id="m_shoot" src="space_shoot.mp3"></audio>
    <audio id="m_win" src="space_win.mp3"></audio>
    <audio id="m_lose" src="space_lose.mp3"></audio>

    <script>
        const db = [
            { s: "You ________ smoke in class.", opts: ["mustn't", "can", "should", "have", "do", "is"], ans: "mustn't" },
            { s: "I ________ swim when I was 5.", opts: ["could", "must", "can", "should", "may", "did"], ans: "could" },
            { s: "We ________ go now, it's late.", opts: ["should", "can", "has", "are", "do", "might"], ans: "should" }
        ];
        let score = 0, rd = 1, audio = false;
        const area = document.getElementById("game-area");

        function load() {
            if(rd > db.length) { document.getElementById("m_win").play(); alert("¡VICTORIA!"); location.reload(); return; }
            const m = db[rd-1]; document.getElementById("sentence").innerText = m.s;
            document.getElementById("rd").innerText = rd;
            const shuffled = [...m.opts].sort(() => Math.random() - 0.5);
            area.innerHTML = "";
            shuffled.forEach((o, i) => {
                const div = document.createElement("div");
                div.className = "invader"; div.innerText = o;
                div.style.left = (i * (area.clientWidth / 6) + 5) + "px";
                div.style.top = "-50px"; div.style.borderColor = ["#0f0","#f0f","#0cf","#ff0","#f33","#fff"][i];
                div.onclick = () => { 
                    if(!audio) { document.getElementById("m_bg").play(); audio = true; }
                    document.getElementById("m_shoot").currentTime = 0;
                    document.getElementById("m_shoot").play();
                    if(o === m.ans) { score += 100; rd++; load(); }
                    else { score = Math.max(0, score - 50); }
                    document.getElementById("score").innerText = score;
                };
                area.appendChild(div);
            });
        }
        setInterval(() => {
            document.querySelectorAll(".invader").forEach(inv => {
                let top = parseInt(inv.style.top) + 2;
                inv.style.top = top + "px";
                if(top > area.clientHeight - 40) { document.getElementById("m_lose").play(); alert("GAME OVER"); location.reload(); }
            });
        }, 35);
        load();
    </script>
</body>
</html>

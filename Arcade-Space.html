<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MODAL DEFENSE - PURE MODALS</title>
    <style>
        :root { --p: #00ff41; --s: #ff00ff; --t: #00d4ff; }
        body { margin: 0; background: #020205; color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; text-transform: uppercase; }
        #start-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 4px double var(--p); margin: 10px; }
        .hud { display: flex; justify-content: space-around; padding: 10px; background: #000; border-bottom: 2px solid var(--t); box-shadow: 0 0 15px var(--t); }
        #sentence-area { padding: 15px; text-align: center; font-size: 1.2rem; color: var(--p); text-shadow: 0 0 10px var(--p); min-height: 40px; }
        #game-area { height: calc(100vh - 120px); position: relative; width: 100%; overflow: hidden; }
        .invader { position: absolute; padding: 10px 15px; border: 2px solid; border-radius: 4px; font-weight: bold; background: rgba(0,0,0,0.8); cursor: pointer; box-shadow: 0 0 10px inset; transition: transform 0.1s; white-space: nowrap; font-size: 0.9rem; }
        .fb { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 3rem; font-weight: bold; z-index: 500; pointer-events: none; text-shadow: 0 0 20px #000; }
        .btn-start { padding: 15px 40px; background: transparent; border: 2px solid var(--s); color: var(--s); font-weight: bold; font-size: 1.5rem; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px var(--s); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="color:var(--t)">MODAL DEFENSE 2026</h1>
        <p>ONLY PURE MODALS | 7 LIVES | 10 MISSIONS<br>ROTATE DEVICE TO LANDSCAPE</p>
        <button class="btn-start" onclick="startGame()">INITIALIZE SYSTEM</button>
    </div>

    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>HP: <span id="lives">7</span></div>
        <div id="progress">RD: 1/10</div>
    </div>
    <div id="sentence-area">STANDBY...</div>
    <div id="game-area"></div>

    <audio id="m_bg" src="space_bg.mp3" loop></audio>
    <audio id="m_shoot" src="space_shoot.mp3"></audio>
    <audio id="m_win" src="space_win.mp3"></audio>
    <audio id="m_lose" src="space_lose.mp3"></audio>

    <script>
        const pureModalsDB = [
            { s: "You ________ smoke in the hospital.", opts: ["mustn't", "can", "should", "will", "may", "shall"], ans: "mustn't" },
            { s: "I ________ swim when I was 5 years old.", opts: ["could", "must", "can", "should", "might", "shall"], ans: "could" },
            { s: "It's cloudy. It ________ rain later.", opts: ["might", "must", "shall", "will", "can", "should"], ans: "might" },
            { s: "________ I open the window, please?", opts: ["May", "Must", "Will", "Shall", "Should", "Can"], ans: "May" },
            { s: "You ________ study if you want to pass.", opts: ["should", "mustn't", "might", "can", "will", "shall"], ans: "should" },
            { s: "He ________ be at the office; I saw his car.", opts: ["must", "can't", "shall", "may", "will", "might"], ans: "must" },
            { s: "I ________ help you with your homework.", opts: ["will", "mustn't", "might", "should", "shall", "could"], ans: "will" },
            { s: "You ________ park here; it is forbidden.", opts: ["can't", "must", "should", "will", "may", "shall"], ans: "can't" },
            { s: "We ________ go now, or we will be late.", opts: ["must", "could", "might", "can", "may", "shall"], ans: "must" },
            { s: "________ we dance?", opts: ["Shall", "Must", "Will", "Should", "Can", "Might"], ans: "Shall" }
        ];

        let gameDB = [], score = 0, lives = 7, rd = 0, active = false;
        const area = document.getElementById("game-area");

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("m_bg").play();
            gameDB = pureModalsDB.sort(() => 0.5 - Math.random()).slice(0, 10);
            active = true;
            nextRound();
        }

        function nextRound() {
            if(rd >= 10) return endGame("SYSTEM CLEARED");
            area.innerHTML = "";
            const m = gameDB[rd];
            document.getElementById("sentence-area").innerText = m.s;
            document.getElementById("progress").innerText = `RD: ${rd+1}/10`;
            
            m.opts.sort(() => Math.random() - 0.5).forEach((o, i) => {
                const div = document.createElement("div");
                div.className = "invader"; div.innerText = o;
                div.style.left = (i * (area.clientWidth / 6) + 5) + "px";
                div.style.top = -(Math.random() * 250 + 50) + "px"; 
                div.style.borderColor = ["#0f0","#f0f","#0cf","#ff0","#f33","#fff"][i];
                div.onclick = () => check(o === m.ans, div);
                area.appendChild(div);
            });
        }

        function check(correct, div) {
            document.getElementById("m_shoot").currentTime = 0;
            document.getElementById("m_shoot").play();
            const fb = document.createElement("div"); fb.className = "fb";
            if(correct) {
                score += 100; fb.innerText = "PERFECT!"; fb.style.color = "#0f0";
                rd++; setTimeout(nextRound, 600);
            } else {
                lives--; score = Math.max(0, score-50); fb.innerText = "FAIL"; fb.style.color = "#f00";
                if(lives <= 0) endGame("TERMINATED");
            }
            area.appendChild(fb);
            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;
            setTimeout(() => fb.remove(), 500);
        }

        function endGame(msg) {
            active = false; document.getElementById("m_bg").pause();
            document.getElementById(lives > 0 ? "m_win" : "m_lose").play();
            alert(msg + "\nSCORE: " + score);
            location.reload();
        }

        setInterval(() => {
            if(!active) return;
            document.querySelectorAll(".invader").forEach(inv => {
                let top = parseFloat(inv.style.top) + (1.3 + rd*0.1);
                inv.style.top = top + "px";
                if(top > area.clientHeight) { lives--; document.getElementById("lives").innerText = lives; inv.remove(); if(lives<=0) endGame("OUT OF BOUNDS"); }
            });
        }, 30);
    </script>
</body>
</html>

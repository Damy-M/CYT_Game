<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYT Arcade: Mission Control</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050508;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Efecto de líneas de escaneo arcade */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
        }

        .header {
            margin-top: 40px;
            text-align: center;
        }

        /* Ajuste del Logo */
        .logo-img {
            max-width: 280px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-pink);
            border: 2px solid var(--neon-blue);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 50px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 90%;
            max-width: 450px;
            z-index: 10;
        }

        .cyber-card {
            position: relative;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            text-decoration: none;
            color: white;
            text-align: center;
            transition: 0.4s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .cyber-card:hover {
            transform: scale(1.05);
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        .cyber-card h2 {
            margin: 0;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .cyber-card span {
            font-size: 0.7rem;
            letter-spacing: 2px;
            opacity: 0.8;
            display: block;
            margin-bottom: 5px;
        }

        .pink-btn {
            border-color: var(--neon-pink);
        }

        .pink-btn:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="IMG_20260505_123303.png" alt="CYT Logo" class="logo-img">
        <h1>Mission Select</h1>
    </div>

    <div class="menu-container">
        <a href="Arcade-Modal-Space/index.html" class="cyber-card">
            <span>MODAL VERBS DEFENSE</span>
            <h2>MISSION 01: SPACE ARCADE</h2>
        </a>

        <a href="Grammar%20snake/index.html" class="cyber-card pink-btn">
            <span>SENTENCE STRUCTURE</span>
            <h2>MISSION 02: GRAMMAR SNAKE</h2>
        </a>
    </div>

    <div class="footer">CYT ARCADE • UDLA 2026</div>

</body>
</html>
